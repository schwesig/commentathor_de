name: Post to Mastodon

on:
  push:
    branches:
      - main
    paths:
      - 'content/posts/*.md'

permissions:
  contents: read

jobs:
  toot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new english post
        id: post
        run: |
          # Get newly added english post files in this push
          NEW_FILE=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'content/posts/*.md' | head -1)

          if [ -z "$NEW_FILE" ]; then
            echo "No new english post found, skipping."
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "found=true" >> $GITHUB_OUTPUT
          echo "file=$NEW_FILE" >> $GITHUB_OUTPUT

          # Extract title from frontmatter
          # If bilingual (DE / EN format: "German / English"), use english part after "/"
          # If title has no "/" and looks german-only, skip
          RAW_TITLE=$(grep '^title' "$NEW_FILE" | head -1 | sed "s/title = //;s/['\"]//g")
          if echo "$RAW_TITLE" | grep -q '/'; then
            # Bilingual: take english part after "/"
            TITLE=$(echo "$RAW_TITLE" | sed 's|.*/ *||' | sed 's/ *$//')
          else
            # Check if post has english crosslink — if not, it's german-only, skip
            if ! grep -q 'Read this in English\|read this in english' "$NEW_FILE"; then
              echo "German-only post, skipping."
              echo "found=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            TITLE="$RAW_TITLE"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

          # Extract tags
          TAGS=$(grep '^tags' "$NEW_FILE" | head -1 | sed "s/tags = \[//;s/\]//;s/'//g;s/\"//g;s/, / /g" | tr ' ' '\n' | sed 's/^/#/' | tr '\n' ' ')
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

          # Build URL from filename
          SLUG=$(basename "$NEW_FILE" .md)
          echo "url=https://commentathor.de/posts/$SLUG" >> $GITHUB_OUTPUT

      - name: Post to Mastodon
        if: steps.post.outputs.found == 'true'
        env:
          POST_TITLE: ${{ steps.post.outputs.title }}
          POST_URL: ${{ steps.post.outputs.url }}
          POST_TAGS: ${{ steps.post.outputs.tags }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: |
          STATUS="${POST_TITLE}

${POST_URL}

${POST_TAGS}"

          curl -s -X POST \
            -H "Authorization: Bearer ${MASTODON_TOKEN}" \
            -F "status=${STATUS}" \
            -F "visibility=public" \
            https://fosstodon.org/api/v1/statuses
